# Single-host cert: letsencrypt-prod solves http01, which can't issue wildcards.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pb
  namespace: pb
spec:
  commonName: pb.bevsoft.com
  dnsNames:
    - pb.bevsoft.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: pb-tls
