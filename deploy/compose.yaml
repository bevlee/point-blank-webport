name: pb
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pb
      POSTGRES_USER: pb
      POSTGRES_PASSWORD: ${PB_DB_PASSWORD:?Set a unique database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pb -d pb]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: ${PB_BACKEND_IMAGE:-pb-friends-backend:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PB_DB_HOST: postgres
      PB_DB_PORT: '5432'
      PB_DB_NAME: pb
      PB_DB_USER: pb
      PB_DB_PASS: ${PB_DB_PASSWORD:?Set a unique database password}
      PB_WEB_ORIGINS: ${PB_ORIGIN:?Set the exact frontend origin}
      PB_TRUST_PROXY: '1'
      PB_NO_TCP: '1'
      PB_IDLE_KICK_MIN: '0'
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
      CF_TURN_API_TOKEN: ${CF_TURN_API_TOKEN:-}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8090/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
  frontend:
    image: ${PB_FRONTEND_IMAGE:-pb-friends-frontend:local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${PB_BIND_HOST:-127.0.0.1}:${PB_HTTP_PORT:-18800}:8080'
    volumes:
      - type: bind
        source: ${PB_ASSETS_DIR:?Set the converted assets directory}
        target: /game-assets
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 5
  https:
    image: caddy:2-alpine
    profiles: [public]
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      PB_DOMAIN: ${PB_DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
