  namespace: pb
  labels: {app: pb-turn}
  annotations:
    oci.oraclecloud.com/load-balancer-type: nlb
    oci-network-load-balancer.oraclecloud.com/is-preserve-source: "true"
    oci-network-load-balancer.oraclecloud.com/oci-network-security-groups: ocid1.networksecuritygroup.oc1.ap-sydney-1.aaaaaaaasu7w5bmfhzch6kiutqqmati5eqee5fohehzswaz4ylerytmd63dq
