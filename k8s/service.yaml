apiVersion: v1
kind: Service
metadata:
  name: pb
  namespace: pb
  labels:
    app: pb
spec:
  selector:
    app: pb
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
      appProtocol: http
    - name: backend
      port: 8090
      targetPort: backend
      protocol: TCP
